name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle build, unit tests and lint
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug

      - name: Gradle-free build (build.sh, same toolchain as the release APK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner > /dev/null
          JAR=$(ls -d $ANDROID_HOME/platforms/android-3[4-9]/android.jar | head -1)
          echo "Using $JAR"
          ANDROID_JAR=$JAR ./build.sh
          cp build-local/SoundPlayer-*.apk SoundPlayer-ci.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            SoundPlayer-ci.apk
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: warn

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 34
            target: default
          - api-level: 30
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash ci/emulator-test.sh apks/SoundPlayer-ci.apk

      - name: Publish test results to the ci-results branch
        if: always()
        run: |
          mkdir -p /tmp/results/api-${{ matrix.api-level }}
          cp -r ci-out/* /tmp/results/api-${{ matrix.api-level }}/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin ci-results && git checkout -B ci-results origin/ci-results || git checkout --orphan ci-results
            git rm -rq --cached . > /dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git checkout origin/ci-results -- . 2>/dev/null || true
            rm -rf api-${{ matrix.api-level }}
            cp -r /tmp/results/api-${{ matrix.api-level }} .
            git add -A
            git commit -qm "CI results API ${{ matrix.api-level }} (${GITHUB_SHA::7})" || true
            git push origin ci-results && break
            sleep 5
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results-api-${{ matrix.api-level }}
          path: ci-out/
